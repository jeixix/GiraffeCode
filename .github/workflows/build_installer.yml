name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - test-new-features
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable & Setup Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build Standalone Executable (PyInstaller)
        run: |
          pyinstaller GiraffeCode.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavannaCode-Windows-Installer
          path: installer_output/*.exe

      - name: Publish Public GitHub Release (No Login Required)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0-preview' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('SavannaCode {0}', github.ref_name) || 'SavannaCode Windows Installer' }}
          files: installer_output/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

